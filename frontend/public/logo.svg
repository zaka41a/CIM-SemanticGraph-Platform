<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer nodes forming the "C" shape -->
  <circle cx="100" cy="30" r="8" fill="#f39c12"/>
  <circle cx="140" cy="40" r="8" fill="#e67e22"/>
  <circle cx="165" cy="65" r="8" fill="#f39c12"/>
  <circle cx="175" cy="100" r="8" fill="#e67e22"/>
  <circle cx="165" cy="135" r="8" fill="#f39c12"/>
  <circle cx="140" cy="160" r="8" fill="#e67e22"/>
  <circle cx="100" cy="170" r="8" fill="#f39c12"/>

  <!-- Inner nodes -->
  <circle cx="80" cy="60" r="7" fill="#486581"/>
  <circle cx="120" cy="70" r="7" fill="#627d98"/>
  <circle cx="130" cy="100" r="7" fill="#486581"/>
  <circle cx="120" cy="130" r="7" fill="#627d98"/>
  <circle cx="80" cy="140" r="7" fill="#486581"/>

  <!-- Center connecting node -->
  <circle cx="100" cy="100" r="6" fill="#243447"/>

  <!-- Connections - outer ring -->
  <line x1="100" y1="30" x2="140" y2="40" stroke="#627d98" stroke-width="2" opacity="0.6"/>
  <line x1="140" y1="40" x2="165" y2="65" stroke="#627d98" stroke-width="2" opacity="0.6"/>
  <line x1="165" y1="65" x2="175" y2="100" stroke="#627d98" stroke-width="2" opacity="0.6"/>
  <line x1="175" y1="100" x2="165" y2="135" stroke="#627d98" stroke-width="2" opacity="0.6"/>
  <line x1="165" y1="135" x2="140" y2="160" stroke="#627d98" stroke-width="2" opacity="0.6"/>
  <line x1="140" y1="160" x2="100" y2="170" stroke="#627d98" stroke-width="2" opacity="0.6"/>

  <!-- Connections - inner to center -->
  <line x1="100" y1="30" x2="100" y2="100" stroke="#486581" stroke-width="2" opacity="0.4"/>
  <line x1="80" y1="60" x2="100" y2="100" stroke="#486581" stroke-width="2" opacity="0.4"/>
  <line x1="120" y1="70" x2="100" y2="100" stroke="#486581" stroke-width="2" opacity="0.4"/>
  <line x1="130" y1="100" x2="100" y2="100" stroke="#486581" stroke-width="2" opacity="0.4"/>
  <line x1="120" y1="130" x2="100" y2="100" stroke="#486581" stroke-width="2" opacity="0.4"/>
  <line x1="80" y1="140" x2="100" y2="100" stroke="#486581" stroke-width="2" opacity="0.4"/>
  <line x1="100" y1="170" x2="100" y2="100" stroke="#486581" stroke-width="2" opacity="0.4"/>

  <!-- Cross connections for network effect -->
  <line x1="140" y1="40" x2="120" y2="70" stroke="#486581" stroke-width="1.5" opacity="0.3"/>
  <line x1="165" y1="65" x2="130" y2="100" stroke="#486581" stroke-width="1.5" opacity="0.3"/>
  <line x1="165" y1="135" x2="120" y2="130" stroke="#486581" stroke-width="1.5" opacity="0.3"/>
  <line x1="140" y1="160" x2="120" y2="130" stroke="#486581" stroke-width="1.5" opacity="0.3"/>

  <!-- Glow effect on center node -->
  <circle cx="100" cy="100" r="10" fill="none" stroke="#f39c12" stroke-width="1" opacity="0.3"/>
  <circle cx="100" cy="100" r="14" fill="none" stroke="#f39c12" stroke-width="0.5" opacity="0.2"/>
</svg>
