services:
  # Apache Jena Fuseki - SPARQL Triple Store
  fuseki:
    image: stain/jena-fuseki:latest
    container_name: cim-fuseki
    ports:
      - "3030:3030"
    environment:
      - ADMIN_PASSWORD=admin
      - FUSEKI_DATASET_1=cim
    volumes:
      - fuseki-data:/fuseki
    networks:
      - cim-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/$/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Power Flow Microservice (Python/Pandapower)
  powerflow:
    build:
      context: ../powerflow-service
      dockerfile: Dockerfile
    image: cim-powerflow-service:latest
    container_name: cim-powerflow
    ports:
      - "8000:8000"
    networks:
      - cim-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Backend API Service (Spring Boot)
  cim-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: cim-semanticgraph-backend:latest
    container_name: cim-backend
    ports:
      - "8080:8080"
    environment:
      # Spring Boot Configuration
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8080

      # Jena Fuseki Configuration
      - JENA_FUSEKI_REMOTE_URL=http://fuseki:3030
      - JENA_FUSEKI_DATASET=cim

      # Power Flow Service
      - POWERFLOW_SERVICE_URL=http://powerflow:8000

      # Logging Configuration
      - LOGGING_FILE_NAME=/app/logs/application.log
      - LOGGING_LEVEL_ROOT=INFO
      - LOGGING_LEVEL_COM_CIM=DEBUG

      # OpenAI Configuration (Embeddings)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

      # Qdrant Vector DB Configuration
      - QDRANT_URL=http://qdrant:6333

      # Chat providers
      - LLM_DEFAULT_PROVIDER=${LLM_DEFAULT_PROVIDER:-gpt5}
      - KICONNECT_API_KEY=${KICONNECT_API_KEY:-}
      - KICONNECT_BASE_URL=${KICONNECT_BASE_URL:-https://chat.kiconnect.nrw/api/v1}
      - KICONNECT_MODEL=${KICONNECT_MODEL:-gpt-5.5}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-fable-5}
      - GROQ_API_KEY=${GROQ_API_KEY:-your-groq-api-key-here}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - GROQ_BASE_URL=https://api.groq.com/openai/v1

      # Ollama Configuration (fallback)
      - OLLAMA_API_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2

      # File Upload Configuration
      - SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE=100MB
      - SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE=100MB

      # Memory Configuration
      - JAVA_OPTS=-Xms512m -Xmx2g

    volumes:
      # Persistent storage for logs
      - logs-data:/app/logs
      # Persistent storage for uploaded files
      - uploads-data:/app/uploads

    networks:
      - cim-network

    depends_on:
      fuseki:
        condition: service_healthy
      powerflow:
        condition: service_healthy
      qdrant:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    restart: unless-stopped

  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: cim-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - cim-network
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Ollama Service (Local LLM - Fallback)
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: cim-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - cim-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

# Named Volumes for Data Persistence
volumes:
  fuseki-data:
    name: cim-fuseki-data
    driver: local

  logs-data:
    name: cim-logs-data
    driver: local

  uploads-data:
    name: cim-uploads-data
    driver: local

  ollama-data:
    name: cim-ollama-data
    driver: local

  qdrant-data:
    name: cim-qdrant-data
    driver: local

# Network Configuration
networks:
  cim-network:
    name: cim-network
    driver: bridge
